[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rrun-cli"
version = "0.3.1"
description = "Agent-friendly remote execution over SSH: scripts via stdin pipes (no quoting/encoding hell), credentials stay on disk and out of agent context. python/powershell/bash, plus a unified remote Python 3.12 venv provisioner."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "waqiju" }]
keywords = ["ssh", "remote-exec", "powershell", "windows", "ops", "automation", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
# 纯标准库实现，零第三方依赖。控制端仅需本机有 ssh + sshpass。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/waqiju/rrun"
Repository = "https://github.com/waqiju/rrun"
Issues = "https://github.com/waqiju/rrun/issues"
Changelog = "https://github.com/waqiju/rrun/blob/main/CHANGELOG.md"
Documentation = "https://github.com/waqiju/rrun/blob/main/docs/remote-exec-conventions.md"

[project.scripts]
rrun = "rrun.__main__:main"
remote-machine = "rrun.__main__:main"  # 旧名别名，兼容期保留

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rrun = ["remote-requirements.txt", "machines.template.json", "machines.d.README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
# E501 交给格式化宽限：项目内大量中文注释 + 单行 wrapper 模板，硬限 120 收益低
ignore = ["E501"]
